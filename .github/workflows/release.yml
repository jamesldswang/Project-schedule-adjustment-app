name: Release to GitHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Package release archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUNDLE_DIR="Project-schedule-adjustment-app-${TAG_NAME}"
          mkdir -p "${BUNDLE_DIR}"
          cp -r dist "${BUNDLE_DIR}/dist"
          cp package.json README.md CHANGELOG.md start_schedule_app.bat "${BUNDLE_DIR}/"
          zip -r "${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Project-schedule-adjustment-app-${{ github.ref_name }}.zip
          generate_release_notes: true
